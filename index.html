<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakumon</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link href="./output.css" rel="stylesheet">
</head>

<body class="bg-backgroundlight dark:bg-backgrounddark">
    <div class="w-2xl max-w-full mx-auto">
        <div class="bg-cardlight dark:bg-carddark rounded-b-xl mx-4 text-center py-4">
            <a class="text-sm mx-3 text-textsecondarylight dark:text-textsecondarydark hover:text-theme" href="">
                Home
            </a>
            <a class="text-sm mx-3 text-textsecondarylight dark:text-textsecondarydark hover:text-theme"
                href="#projects">
                Projects
            </a>
        </div>

        <div class="bg-cardlight dark:bg-carddark rounded-xl py-10 mx-4 mt-6 flex flex-col items-center">
            <img class="w-24 h-24 rounded-full" src="https://avatars.githubusercontent.com/u/12182189?v=4">
            <div class="mt-2 text-xs text-textsecondarylight dark:text-textsecondarydark">
                @Bakumon
            </div>
            <div class="mt-2 text-2xl text-textprimarylight dark:text-textprimarydark font-medium">
                食梦兽 (Bakumon)
            </div>
            <div class="mt-6 text-textsecondarylight dark:text-textsecondarydark text-center text-sm">
                Android 开发工程师 / 半生独立开发者。
                <br>
                喜欢做好玩的 Android 和 Web 应用。
            </div>
        </div>

        <div class="bg-cardlight dark:bg-carddark rounded-xl mx-4 mt-6 pb-10 px-5 md:px-10">
            <div class="text-theme text-2xl pt-8" id="projects">
                Projects
            </div>
            <a class="group flex items-center bg-itemlight dark:bg-itemdark hover:bg-itemhoverlight dark:hover:bg-itemhoverdark transition-colors duration-300 rounded-xl mt-6 p-3 drop-shadow-xs"
                href="https://fuun.fun/">
                <img class="w-18 h-18 rounded-xl" src="https://s1.ax1x.com/2023/08/24/pPYxBTO.png">
                <div class="grow ml-3">
                    <div class="text-lg text-textprimarylight dark:text-textprimarydark">
                        奇趣网站收藏家
                    </div>
                    <div class="text-sm text-textsecondarylight dark:text-textsecondarydark mt-1">
                        收集那些看起来无用但却有趣的网站（Web）
                    </div>
                </div>
                <div class="w-8 h-8 mr-2 rounded-md bg-cardlight dark:bg-carddark hidden md:flex">
                    <svg class="w-4 h-4 m-auto stroke-textsecondarylight dark:stroke-textsecondarydark group-hover:stroke-theme transition-colors duration-300"
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="feather feather-arrow-right">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>
            <a class="group flex items-center bg-itemlight dark:bg-itemdark hover:bg-itemhoverlight dark:hover:bg-itemhoverdark transition-colors duration-300 rounded-xl mt-6 p-3 drop-shadow-xs"
                href="https://wallet.bakumon.me/">
                <img class="w-18 h-18 rounded-xl"
                    src="https://camo.githubusercontent.com/854d006495477f1a5537464a7a049961929272e2401f4bdeecd9d4c673627854/68747470733a2f2f692e6c6f6c692e6e65742f323032312f31302f30392f437954706c5648714e67737a6441752e706e67">
                <div class="grow ml-3">
                    <div class="text-lg text-textprimarylight dark:text-textprimarydark">
                        那样记账
                    </div>
                    <div class="text-sm text-textsecondarylight dark:text-textsecondarydark mt-1">
                        一款面向个人，纯粹的记账应用（Android）
                    </div>
                </div>
                <div class="w-8 h-8 mr-2 rounded-md bg-cardlight dark:bg-carddark hidden md:flex">
                    <svg class="w-4 h-4 m-auto stroke-textsecondarylight dark:stroke-textsecondarydark group-hover:stroke-theme transition-colors duration-300"
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="feather feather-arrow-right">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>
            <a class="group flex items-center bg-itemlight dark:bg-itemdark hover:bg-itemhoverlight dark:hover:bg-itemhoverdark transition-colors duration-300 rounded-xl mt-6 p-3 drop-shadow-xs"
                href="https://foliorss.com/">
                <img class="w-18 h-18 rounded-xl"
                    src="https://camo.githubusercontent.com/ec16b7997b77c061a1148dbfc959a86370422d70962e7adb3029a600bcba300f/68747470733a2f2f692e6c6f6c692e6e65742f323032312f30372f31372f495071384b4d326b663137413365622e706e67">
                <div class="grow ml-3">
                    <div class="text-lg text-textprimarylight dark:text-textprimarydark">
                        Folio Reader
                    </div>
                    <div class="text-sm text-textsecondarylight dark:text-textsecondarydark mt-1">
                        一款简洁现代的 RSS 阅读器（Android）
                    </div>
                </div>
                <div class="w-8 h-8 mr-2 rounded-md bg-cardlight dark:bg-carddark hidden md:flex">
                    <svg class="w-4 h-4 m-auto stroke-textsecondarylight dark:stroke-textsecondarydark group-hover:stroke-theme transition-colors duration-300"
                        xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="feather feather-arrow-right">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>
        </div>

        <div
            class="bg-cardlight dark:bg-carddark rounded-t-xl mx-4 mt-6 text-textsecondarylight dark:text-textsecondarydark text-xs text-center py-4">
            Bakumon © 2025
        </div>
    </div>
</body>

</html>
