server{
    listen 80;  # 指定端口，nginx默认端口为80
    server_name bakumon.me;  # 指定域名
    error_page 404 /404.html;
    location / {
        root /root/bakumon.me/public;  # 指定静态网站根目录
        index index.html;  #指定默认访问文件
    }
    # 可以将默认 80 端口的 HTTP 请求重定向为 HTTPS（可选项，可以不配置）。
    rewrite ^(.*)$ https://$host$1 permanent;
}
server {
    #SSL 访问端口号为 443
    #listen 443;
    #启用 SSL 功能
    #ssl on;
    # 由于版本问题，配置文件可能存在不同的写法。此处需要使用 listen 443 ssl 代替以上写法
    listen 443 ssl;
    #填写绑定证书的域名
    server_name bakumon.me;
    #证书文件名称（此处的证书文件放在 /etc/nginx/ssl-nginx-qcloud 目录下）
    ssl_certificate /root/bakumon.me/Nginx/bakumon.me_bundle.crt;
    #私钥文件名称（此处的私钥文件放在 /etc/nginx/ssl-nginx-qcloud 目录下）
    ssl_certificate_key /root/bakumon.me/Nginx/bakumon.me.key;
    ssl_session_timeout 5m;
    #请按照以下协议配置
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    #请按照以下套件配置，配置加密套件，写法遵循 openssl 标准（照抄即可不用修改）。
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    error_page 404 /404.html;
    location / {
        #网站主页路径。此路径仅供参考，具体请您按照实际目录操作。
        root /root/bakumon.me/public;
        #指定默认访问的文件
        index index.html;
    }
}